<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vorschaubild 1200×630</title>
<!-- Vorlage fuer img/vorschau.png (das Bild, das Messenger und soziale Netzwerke beim Teilen von
     crankscore.de zeigen, og:image). Die Texte kommen aus texte.js (englische Fassung = Standardsprache,
     Schluessel in data-t), das Rad ist das Blender-Rendering aus img/rad, das Handy zeigt eine echte
     App-Aufnahme aus img/app/en/hell. Farben und Schriften wie Website und App.
     Neu erzeugen: im Repo-Ordner python3 -m http.server 8766, dann
     http://127.0.0.1:8766/werkzeuge/vorschau.html bei genau 1200×630 Pixeln als PNG abfotografieren
     (z. B. Chrome-Entwicklertools, Geraet 1200×630, "Screenshot aufnehmen") und als img/vorschau.png
     speichern. werkzeuge/ wird nicht veroeffentlicht (_config.yml). -->
<style>
@font-face{font-family:"Inter";src:url(../fonts/inter-400-800-latin.woff2) format("woff2");font-weight:400 800}
@font-face{font-family:"Barlow Semi Condensed";src:url(../fonts/barlowsemicondensed-700-latin.woff2) format("woff2");font-weight:700}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;font-family:"Inter",sans-serif;color:#14171b;background:#f2f0ec}
.text{position:absolute;left:72px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
.marke{display:flex;align-items:center;gap:12px;font:700 30px/1 "Barlow Semi Condensed",sans-serif;letter-spacing:.07em}
.marke svg{width:46px;height:35px;color:#2563a8}
.marke b{color:#5b5f65}
h1{margin:34px 0 0;font:700 78px/.95 "Barlow Semi Condensed",sans-serif;letter-spacing:-.005em}
p{margin:26px 0 0;font-size:24px;line-height:1.4;color:#43474d;max-width:20em}
.rad{position:absolute;left:556px;top:178px;width:430px}
.handy{position:absolute;left:972px;top:56px;width:196px;aspect-ratio:720/1640;padding:7px;border-radius:33px;background:#1b1d21;box-shadow:0 30px 60px -20px rgba(20,23,27,.45)}
.glas{height:100%;border-radius:26px;overflow:hidden;background:#f2f0ec}
.leiste{height:5.2%;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 24px;font:600 10px/1 "Inter",sans-serif}
.glas img{display:block;width:100%}
.beispiel{position:absolute;left:72px;bottom:38px;font:600 14px/1 "Inter",sans-serif;color:#5b5f65}
</style>
</head>
<body>
  <div class="text">
    <div class="marke"><svg viewBox="-152 -114 304 228" aria-hidden="true"><defs><mask id="l" maskUnits="userSpaceOnUse" x="-152" y="-114" width="304" height="228"><rect x="-152" y="-114" width="304" height="228" fill="#fff"/><circle r="15" fill="#000"/><circle cx="129.8" cy="-33.3" r="9" fill="#000"/></mask></defs><g mask="url(#l)" fill="currentColor" id="logo"></g></svg><span>CRANK<b>SCORE</b></span></div>
    <h1 data-th="start.h1">Your bike.<br>Matching parts.<br>A clear plan.</h1>
    <p data-t="seite.ogdesc">x</p>
  </div>
  <img class="rad" src="../img/rad/rad-held.webp" alt="">
  <div class="handy"><div class="glas"><div class="leiste">9:41</div><img src="../img/app/en/hell/uebersicht.webp" alt=""></div></div>
  <div class="beispiel">crankscore.de</div>
<script src="../texte.js"></script>
<script>
  /* Logo wie auf der Website (Symbol #cs-logo aus index.html) und englische Texte aus texte.js */
  fetch("../index.html").then(function(r){ return r.text(); }).then(function(h){
    var m = h.match(/<symbol id="cs-logo"[^>]*><g[^>]*>([\s\S]*?)<\/g><\/symbol>/); if(m) document.getElementById("logo").innerHTML = m[1];
  });
  (function(){
    var TX = window.CS_TEXTE; if(!TX) return;
    [].forEach.call(document.querySelectorAll("[data-t],[data-th]"), function(e){
      var k = e.getAttribute("data-t") || e.getAttribute("data-th"), paar = TX.texte[k];
      if(!paar) return; var t = TX.fuelle(paar[1], "en");
      if(e.hasAttribute("data-th")) e.innerHTML = t; else e.textContent = t;
    });
  })();
</script>
</body>
</html>
